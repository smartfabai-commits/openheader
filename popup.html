<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenHeader</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f6f7f9; --line:#e4e7ec; --txt:#1c2230; --muted:#6b7280;
    --accent:#4f46e5; --ok:#16a34a; --danger:#e5484d; --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171f; --panel:#1b1f2a; --line:#2a303c; --txt:#e8ebf3; --muted:#9aa1b2; --accent:#7c7bff; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{width:390px;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);font-size:13px;line-height:1.5}
  header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#22d3ee);
    display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;flex:none}
  .brand{font-weight:800;font-size:15px}
  .brand small{display:block;font-weight:600;color:var(--muted);font-size:10px;letter-spacing:.02em}
  .master{margin-left:auto;display:flex;align-items:center;gap:8px}
  .switch{position:relative;width:42px;height:24px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:99px;cursor:pointer;transition:.15s}
  .slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
  .switch input:checked + .slider{background:var(--ok)}
  .switch input:checked + .slider::before{transform:translateX(18px)}
  .body{padding:12px 14px;max-height:440px;overflow-y:auto}
  .profrow{display:flex;gap:6px;align-items:center;margin-bottom:12px}
  select,input{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:7px 8px;font-size:13px;font-family:inherit;width:100%}
  .iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;
    padding:7px 9px;cursor:pointer;flex:none;font-size:13px}
  .iconbtn:hover{color:var(--accent);border-color:var(--accent)}
  .filter{margin-bottom:14px}
  .filter label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}
  .filter .hint{font-weight:400}
  .section{margin-bottom:8px}
  .sectitle{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
  .sectitle b{font-size:12px;letter-spacing:.02em}
  .addbtn{background:none;border:1px dashed var(--line);color:var(--accent);border-radius:8px;
    padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
  .addbtn:hover{border-color:var(--accent)}
  .hrow{display:flex;gap:5px;align-items:center;margin-bottom:6px}
  .hrow .chk{flex:none;width:16px;height:16px;accent-color:var(--ok);cursor:pointer}
  .hrow .hname{flex:1.1}
  .hrow .hval{flex:1.4}
  .hrow .hop{flex:none;width:76px;padding:7px 4px}
  .hrow .del{flex:none}
  .hrow.remove .hval{opacity:.4;pointer-events:none}
  .empty{color:var(--muted);font-size:12px;text-align:center;padding:8px;border:1px dashed var(--line);border-radius:8px}
  .ioRow{display:flex;gap:14px;margin:-4px 0 12px;padding-bottom:2px}
  .linkbtn{background:none;border:none;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;padding:0;font-family:inherit}
  .linkbtn:hover{text-decoration:underline}
  footer{border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px}
  .trust{font-size:10px;color:var(--muted)}
  .trust b{color:var(--ok)}
  .pro{margin-left:auto;font-size:11px;font-weight:800;color:var(--accent);background:rgba(79,70,229,.1);
    border:1px solid rgba(79,70,229,.25);border-radius:99px;padding:3px 9px;cursor:pointer}
  .previewbadge{display:none;background:#f59e0b;color:#111;text-align:center;font-size:11px;font-weight:800;padding:4px}
</style>
</head>
<body>
<div class="previewbadge" id="previewbadge">🔧 Preview mode — load as an extension to actually modify headers</div>
<header>
  <div class="logo">≡</div>
  <div class="brand">OpenHeader<small>No ads · No tracking · Open source</small></div>
  <div class="master">
    <span id="masterlabel" style="font-size:11px;font-weight:800;color:var(--muted)">OFF</span>
    <label class="switch"><input type="checkbox" id="master"><span class="slider"></span></label>
  </div>
</header>

<div class="body">
  <div class="profrow">
    <select id="profile" title="Profile"></select>
    <button class="iconbtn" id="addProfile" title="New profile">＋</button>
    <button class="iconbtn" id="renameProfile" title="Rename">✎</button>
    <button class="iconbtn" id="delProfile" title="Delete">🗑</button>
  </div>

  <div class="filter">
    <label>URL filter <span class="hint">— empty = apply to all sites. e.g. <code>||api.example.com</code></span></label>
    <input id="urlFilter" placeholder="Apply to all sites (leave empty)" />
  </div>

  <div class="ioRow">
    <button class="linkbtn" id="exportBtn">⬇ Export</button>
    <button class="linkbtn" id="importBtn">⬆ Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
  </div>

  <div class="section">
    <div class="sectitle"><b>▶ Request headers</b><button class="addbtn" data-add="request">＋ Add</button></div>
    <div id="reqList"></div>
  </div>

  <div class="section">
    <div class="sectitle"><b>◀ Response headers</b><button class="addbtn" data-add="response">＋ Add</button></div>
    <div id="resList"></div>
  </div>
</div>

<footer>
  <span class="trust"><b>✓</b> Never reads your traffic. Settings stay on your device.</span>
  <span class="pro" id="proBtn" title="Coming soon">★ Pro (sync/share)</span>
</footer>

<script src="popup.js"></script>
</body>
</html>
